name: Validate with HACS & Hassfest

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS Validation
        if: ${{ !github.event.repository.private }}
        uses: hacs/action@main
        with:
          category: integration

      - name: Notice for private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::notice::HACS validation action requires a public repository and will automatically execute once the repository visibility is set to public."

  validate-hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest Validation
        uses: home-assistant/actions/hassfest@master
