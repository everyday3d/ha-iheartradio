play_station:
  name: Play Station
  description: Play an iHeartRadio live radio station by name, call letters, or station ID on any Home Assistant media player.
  target:
    entity:
      domain: media_player
  fields:
    station:
      name: Station Name, Call Letters, or ID
      description: Station query (e.g. 'Z100', '106.7 Lite FM', 'WHTZ-FM', or station ID '1469').
      example: Z100
      required: true
      selector:
        text:

fade_out:
  name: Fade Volume
  description: Smoothly ramp volume up or down on one or more media players over a specified duration with optional pause on completion.
  target:
    entity:
      domain: media_player
  fields:
    duration:
      name: Duration (Seconds)
      description: Total transition duration in seconds.
      example: 30
      default: 30
      required: false
      selector:
        number:
          min: 1
          max: 1800
          unit_of_measurement: seconds
          mode: box
    target_volume:
      name: Target Volume Level
      description: The final volume level (0.0 to 1.0) after the fade completes.
      example: 0.0
      default: 0.0
      required: false
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
    pause_on_finish:
      name: Pause On Finish
      description: Whether to automatically pause the media player when target volume reaches 0.0.
      default: true
      required: false
      selector:
        boolean:
    curve:
      name: Volume Curve
      description: Volume transition curve (linear or perceptual logarithmic decay).
      default: linear
      required: false
      selector:
        select:
          options:
            - label: Linear
              value: linear
            - label: Logarithmic (Perceptual)
              value: logarithmic

sleep_timer:
  name: Sleep Timer
  description: Set a sleep timer on one or more media players with an optional gentle volume fade-out before pausing or stopping.
  target:
    entity:
      domain: media_player
  fields:
    duration:
      name: Duration (Minutes)
      description: How many minutes until the sleep timer completes.
      example: 30
      required: true
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: minutes
          mode: box
    fade_out:
      name: Enable Fade Out
      description: Whether to gradually ramp the volume down before stopping.
      default: true
      required: false
      selector:
        boolean:
    fade_duration:
      name: Fade Duration (Seconds)
      description: Duration of the volume fade-out preceding the timer completion.
      default: 60
      example: 60
      required: false
      selector:
        number:
          min: 5
          max: 600
          unit_of_measurement: seconds
          mode: box
    action:
      name: Timer Action
      description: Action to perform when the sleep timer finishes.
      default: pause
      required: false
      selector:
        select:
          options:
            - label: Pause Playback
              value: pause
            - label: Stop Playback
              value: stop

cancel_fade:
  name: Cancel Fade / Sleep Timer
  description: Cancel any active volume fade or sleep timer task currently running on the specified media player(s).
  target:
    entity:
      domain: media_player

announce:
  name: Announce with Radio Ducking
  description: Smoothly duck playing radio volume, broadcast a TTS message or audio chime, and automatically resume radio playback and volume.
  target:
    entity:
      domain: media_player
  fields:
    message:
      name: TTS Message
      description: The text message to speak using Home Assistant text-to-speech.
      example: "Build plate clear! 3D print finished successfully."
      required: false
      selector:
        text:
          multiline: true
    media_content_id:
      name: Custom Chime or Sound URL
      description: Optional audio URL or local media path (e.g. /local/doorbell.mp3) to play instead of or alongside TTS.
      example: "/local/doorbell.mp3"
      required: false
      selector:
        text:
    duck_volume:
      name: Ducked Volume Level
      description: The temporary volume level (0.0 to 1.0) while the announcement is speaking.
      default: 0.15
      example: 0.15
      required: false
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
    fade_duration:
      name: Fade Duration (Seconds)
      description: How quickly to fade down and back up (1 to 10 seconds).
      default: 2
      example: 2
      required: false
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: seconds
          mode: box
    wait_time:
      name: Custom Hold Time (Seconds)
      description: Optional override for speech duration. If omitted, duration is calculated automatically from message length.
      example: 5
      required: false
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: seconds
          mode: box
    tts_engine:
      name: TTS Engine
      description: Specific text-to-speech engine to use (e.g. tts.piper, tts.cloud). If omitted, uses the default TTS engine.
      example: "tts.piper"
      required: false
      selector:
        entity:
          domain: tts
    announce_player:
      name: Announcement Speaker
      description: Optional different speaker to play the announcement on. If omitted, plays on the radio speaker.
      example: "media_player.hallway_speaker"
      required: false
      selector:
        entity:
          domain: media_player

play_group:
  name: Play Synchronized Group
  description: Broadcast an iHeartRadio live station concurrently across multiple media players with independent per-speaker volume balancing.
  target:
    entity:
      domain: media_player
  fields:
    station:
      name: Station Name, Call Letters, or ID
      description: Station query (e.g. 'Z100', '106.7 Lite FM', 'WHTZ-FM', or station ID '1469').
      example: Z100
      required: true
      selector:
        text:
    stream_type:
      name: Stream Type
      description: Audio format preference (direct MP3/AAC or HLS adaptive stream).
      required: false
      selector:
        select:
          options:
            - label: Direct Stream (MP3/AAC - Lowest Latency)
              value: direct
            - label: HLS Stream (Adaptive Bitrate)
              value: hls
    volume_level:
      name: Master Volume Level
      description: Optional baseline volume level (0.0 to 1.0) applied across all group target speakers.
      example: 0.4
      required: false
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
    volumes:
      name: Per-Speaker Volume Map
      description: Optional dictionary mapping specific speaker entity IDs to custom volume levels (overriding master volume).
      example: '{"media_player.kitchen": 0.35, "media_player.garage": 0.65}'
      required: false
      selector:
        object:
    sync_start:
      name: Synchronized Start
      description: Concurrently dispatch stream connection to minimize cross-speaker playback delay.
      default: true
      required: false
      selector:
        boolean:

stop_group:
  name: Stop Group Broadcast
  description: Stop or pause playback across active group speakers, or specify target players to remove from multi-room broadcast.
  target:
    entity:
      domain: media_player
  fields:
    action:
      name: Stop Action
      description: Whether to stop or pause the media players.
      default: stop
      required: false
      selector:
        select:
          options:
            - label: Stop Playback
              value: stop
            - label: Pause Playback
              value: pause
