play_station:
  name: Play Station
  description: Play an iHeartRadio live radio station by name, call letters, or station ID on any Home Assistant media player.
  fields:
    entity_id:
      name: Target Media Player
      description: One or more media player entities to stream the radio station to.
      example: media_player.living_room_speaker
      required: true
      selector:
        target:
          entity:
            domain: media_player
    station:
      name: Station Name, Call Letters, or ID
      description: Station query (e.g. 'Z100', '106.7 Lite FM', 'WHTZ-FM', or station ID '1469').
      example: Z100
      required: true
      selector:
        text:
